<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Interactive Hand Particle Art</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            touch-action: none; /* スマホでのスクロール防止 */
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* MediaPipe用のビデオ要素（非表示） */
        #input-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100px;
            height: 100px;
            opacity: 0;
            pointer-events: none;
            z-index: 0;
        }
        #ui-container {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 10;
            pointer-events: none; /* ボタン以外はクリック透過 */
        }
        .shape-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            pointer-events: auto;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .shape-btn:hover, .shape-btn.active {
            background: rgba(255, 255, 255, 0.3);
            border-color: #fff;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 20;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #instructions {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            z-index: 5;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <div>Initializing AI & 3D Engine...</div>
        <div style="font-size: 12px; margin-top: 5px; color: #aaa;">Camera access required</div>
    </div>

    <div id="instructions">Show your hand to interact with particles</div>

    <div id="canvas-container"></div>
    <video id="input-video" playsinline></video>

    <div id="ui-container">
        <button class="shape-btn active" data-shape="sphere">Sphere</button>
        <button class="shape-btn" data-shape="heart">Heart</button>
        <button class="shape-btn" data-shape="torus">Torus</button>
        <button class="shape-btn" data-shape="galaxy">Galaxy</button>
    </div>

    <!-- Import Libraries via ESM -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- MediaPipe Libraries (CDN Global Script fallback for simplicity with worker issues) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration ---
        const PARTICLE_COUNT = 8000; // スマホパフォーマンス考慮
        const PARTICLE_SIZE = 0.15;
        const FIELD_RADIUS = 10;
        const HAND_INFLUENCE_RADIUS = 5.0;
        const HAND_FORCE_STRENGTH = 8.0; // 反発力の強さ

        // --- Global Variables ---
        let scene, camera, renderer, particles, geometry, material;
        let controls;
        let time = 0;
        
        // パーティクルデータ管理
        const originalPositions = new Float32Array(PARTICLE_COUNT * 3); // ターゲット形状の位置
        const currentPositions = new Float32Array(PARTICLE_COUNT * 3);  // 現在の描画位置
        const randomOffsets = new Float32Array(PARTICLE_COUNT);         // キラキラ用オフセット
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        
        // インタラクション
        let handPosition = new THREE.Vector3(1000, 1000, 1000); // 画面外初期値
        let isHandDetected = false;
        let currentShape = 'sphere';

        // --- Initialization ---
        initThree();
        initParticles();
        initMediaPipe();
        animate();
        setupUI();

        function initThree() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.z = 20;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // パフォーマンス最適化
            container.appendChild(renderer.domElement);

            // OrbitControls (デバッグ用 + 視点変更用)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;
            controls.enableZoom = false; // スマホでの誤操作防止

            // 照明（パーティクル自体は発光するが、雰囲気作り）
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);

            window.addEventListener('resize', onWindowResize);
        }

        function initParticles() {
            geometry = new THREE.BufferGeometry();

            // 初期形状計算 (Sphere)
            calculateShape('sphere');

            // 現在位置をターゲット位置で初期化
            currentPositions.set(originalPositions);

            // カラーとランダムオフセットの初期化
            const color = new THREE.Color();
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                // グラデーションカラー (Cyan -> Magenta -> Purple)
                const t = i / PARTICLE_COUNT;
                color.setHSL(0.5 + t * 0.4, 0.8, 0.6);
                
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;

                randomOffsets[i] = Math.random() * Math.PI * 2;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // ShaderMaterial の代わりに PointsMaterial + Custom Texture でシンプルかつ綺麗に
            // カスタムシェーダーは難易度が上がるため、standardな方法でcanvasテクスチャ生成
            const sprite = createParticleTexture();

            material = new THREE.PointsMaterial({
                size: PARTICLE_SIZE,
                map: sprite,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.8
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(0.5, 'rgba(255,255,255,0.2)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 32, 32);
            
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // --- Shape Calculation Logic ---
        function calculateShape(type) {
            currentShape = type;
            const tempPos = [];
            
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let x, y, z;
                
                // 0~1 の正規化インデックス
                const t = i / PARTICLE_COUNT; 
                const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
                const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;

                if (type === 'sphere') {
                    const r = FIELD_RADIUS * (0.8 + Math.random() * 0.2);
                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.sin(phi) * Math.sin(theta);
                    z = r * Math.cos(phi);
                } 
                else if (type === 'heart') {
                    // Heart parametric equation
                    // x = 16sin^3(t)
                    // y = 13cos(t) - 5cos(2t) - 2cos(3t) - cos(4t)
                    // 3D化のために回転させる
                    const hp = i * 0.1; // parameter
                    const hr = FIELD_RADIUS * 0.05; // scale
                    
                    // ランダムな角度でボリュームを持たせる
                    const angle = Math.random() * Math.PI * 2;
                    const r = Math.sqrt(Math.random()); // 内部を埋める
                    
                    // Base heart shape on XY plane
                    const tx = 16 * Math.pow(Math.sin(angle), 3);
                    const ty = 13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle);
                    
                    // 厚みを持たせる
                    const zOffset = (Math.random() - 0.5) * 5;
                    
                    x = tx * hr * r;
                    y = ty * hr * r;
                    z = zOffset;

                    // 上向きに調整
                    y += 2; 
                }
                else if (type === 'torus') {
                    const R = 8; // Major radius
                    const r = 3; // Minor radius
                    const u = Math.random() * Math.PI * 2;
                    const v = Math.random() * Math.PI * 2;
                    
                    x = (R + r * Math.cos(v)) * Math.cos(u);
                    y = (R + r * Math.cos(v)) * Math.sin(u);
                    z = r * Math.sin(v);
                    
                    // ランダム拡散
                    x += (Math.random() - 0.5);
                    y += (Math.random() - 0.5);
                    z += (Math.random() - 0.5);
                }
                else if (type === 'galaxy') {
                    const arms = 3;
                    const armAngle = (Math.random() * Math.PI * 2) / arms; // どの腕に属するか大まかに
                    const spin = i * 0.01; // スパイラルの巻き
                    const dist = Math.random() * FIELD_RADIUS * 1.5; // 中心からの距離
                    
                    // スパイラル形状
                    const angle = spin + dist * 0.5;
                    
                    x = Math.cos(angle) * dist;
                    y = (Math.random() - 0.5) * (FIELD_RADIUS * 0.5 * (1 - dist/15)); // 中心ほど厚く
                    z = Math.sin(angle) * dist;
                }

                originalPositions[i * 3] = x;
                originalPositions[i * 3 + 1] = y;
                originalPositions[i * 3 + 2] = z;
            }
        }

        // --- MediaPipe Hands Setup ---
        function initMediaPipe() {
            const videoElement = document.getElementById('input-video');

            const hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onHandsResults);

            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 640,
                height: 480
            });

            cameraUtils.start()
                .then(() => {
                    const loading = document.getElementById('loading');
                    loading.style.opacity = 0;
                    setTimeout(() => loading.style.display = 'none', 500);
                })
                .catch(err => {
                    console.error("Camera error:", err);
                    document.getElementById('loading').innerHTML = "Camera access denied or error.<br>Please allow camera access.";
                });
        }

        function onHandsResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                isHandDetected = true;
                const landmarks = results.multiHandLandmarks[0];
                
                // 人差し指の先端 (Index 8) と 手のひら (Index 0 or 9) の中間をとる
                // 座標系: x: 0(left) -> 1(right), y: 0(top) -> 1(bottom)
                const indexFinger = landmarks[8];
                
                // スクリーン座標(0-1)を3D空間座標(-Range ~ +Range)に変換
                // カメラのZ位置とFOVから見える範囲を概算
                // z=0付近での可視範囲(高さ) = 2 * z * tan(fov/2)
                // camera.z = 20, fov = 75
                const vFOV = THREE.MathUtils.degToRad(camera.fov);
                const visibleHeight = 2 * Math.tan(vFOV / 2) * 20;
                const visibleWidth = visibleHeight * camera.aspect;

                // MediaPipeは左右反転（鏡像）していることが多いのでXを反転させる
                const x = (0.5 - indexFinger.x) * visibleWidth;
                const y = (0.5 - indexFinger.y) * visibleHeight;
                
                // Z座標の深度推定は難しいため、少し手前(-2)〜奥(5)の間で動かすか、固定する
                // ここではシンプルに z=5 (パーティクルの手前) に固定しつつ、手の大きさ(z)があれば反映
                const z = 5; 

                // スムージング (Lerp)
                handPosition.lerp(new THREE.Vector3(x, y, z), 0.2);

            } else {
                isHandDetected = false;
                // 手が見つからないときは画面外へ逃がす
                handPosition.lerp(new THREE.Vector3(1000, 1000, 1000), 0.1);
            }
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            controls.update(); // 自動回転

            updateParticles();

            renderer.render(scene, camera);
        }

        function updateParticles() {
            const positions = geometry.attributes.position.array;
            
            // 手の反発力のためのベクトル計算用
            const pPos = new THREE.Vector3();
            const force = new THREE.Vector3();

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const idx = i * 3;
                
                // 1. 基本形状への回帰 (Lerp)
                // current -> target
                const tx = originalPositions[idx];
                const ty = originalPositions[idx + 1];
                const tz = originalPositions[idx + 2];

                // 動きにノイズを加える（ゆらぎ）
                const noiseX = Math.sin(time + randomOffsets[i]) * 0.1;
                const noiseY = Math.cos(time * 0.8 + randomOffsets[i]) * 0.1;
                const noiseZ = Math.sin(time * 1.2 + randomOffsets[i]) * 0.1;

                // 現在位置を取得
                let cx = positions[idx];
                let cy = positions[idx + 1];
                let cz = positions[idx + 2];

                // ターゲットへ近づける (Lerp)
                // 形状変更時のスムーズな移動
                cx += (tx + noiseX - cx) * 0.05;
                cy += (ty + noiseY - cy) * 0.05;
                cz += (tz + noiseZ - cz) * 0.05;

                // 2. 手によるインタラクション (Force Field)
                if (isHandDetected) {
                    pPos.set(cx, cy, cz);
                    const dist = pPos.distanceTo(handPosition);

                    if (dist < HAND_INFLUENCE_RADIUS) {
                        // 距離が近いほど強い反発力
                        const strength = (1 - dist / HAND_INFLUENCE_RADIUS) * HAND_FORCE_STRENGTH;
                        
                        // 手からパーティクルへのベクトル
                        force.subVectors(pPos, handPosition).normalize();
                        
                        // 斥力（近づくと逃げる）
                        cx += force.x * strength * 0.2;
                        cy += force.y * strength * 0.2;
                        cz += force.z * strength * 0.2;
                    }
                }

                // 位置更新
                positions[idx] = cx;
                positions[idx + 1] = cy;
                positions[idx + 2] = cz;

                // 3. キラキラ効果 (サイズや色を変更すると重くなるので透明度風に見せるために色を明滅)
                // ポイントマテリアルでは頂点ごとの不透明度はAttributeで制御できない（カスタムシェーダー必要）
                // 代わりに色を暗くすることでフェードを表現
                const blink = Math.sin(time * 3 + randomOffsets[i]) * 0.5 + 0.5; // 0~1
                // 若干色を変えるなど
            }

            geometry.attributes.position.needsUpdate = true;
        }

        // --- UI & Event Listeners ---
        function setupUI() {
            const buttons = document.querySelectorAll('.shape-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // Active class toggle
                    buttons.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');

                    // Change shape
                    const shape = e.target.dataset.shape;
                    calculateShape(shape);
                });
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
